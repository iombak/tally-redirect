
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Weiterleitung</title>
  
</head>
<body style="background-color: white;">

  <div>

  </div>


  <!-- Zufällige Weiterleitung -->


  <script>
    (function rotateLinks() {
      const links = [
        "https://tally.so/r/0Q4NDZ?opt=1",
        "https://tally.so/r/0Q4NDZ?opt=2",
        "https://tally.so/r/0Q4NDZ?opt=3",
        "https://tally.so/r/0Q4NDZ?opt=4",
      ];

      // Zufälligen Link auswählen (je 25 %)
      const index = Math.floor(Math.random() * links.length);
      const url = new URL(links[index]);

      // Aktuelle URL-Parameter übernehmen
      const params = new URLSearchParams(window.location.search);

      params.forEach((value, key) => {
        url.searchParams.append(key, value);
      });

      // Nach 3 Sekunden weiterleiten
      setTimeout(function () {
        window.location.replace(url.toString());
      }, 3000);
    })();
  </script>



</body>
</html>
