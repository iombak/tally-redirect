
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Weiterleitung</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body class="bg-light">

  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card shadow-sm border-0 text-center p-4" style="max-width: 450px;">
      <div class="card-body">
        <h1 class="h4 mb-3">Willkommen!</h1>

        <p class="text-secondary mb-4">
          Du wirst in Kürze weitergeleitet.
        </p>

        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Lädt...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JavaScript (optional für dieses Beispiel) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Zufällige Weiterleitung -->


  <script>
    (function rotateLinks() {

    const limit = 5;
    let links = [];

        for (let i = 1; i < limit; i++) {
        links.push("https://tally.so/r/0Q4NDZ?opt="+ i);
    }

      // Zufälligen Link auswählen (je 25 %)
      const index = Math.floor(Math.random() * links.length);
      const url = new URL(links[index]);

      // Aktuelle URL-Parameter übernehmen
      const params = new URLSearchParams(window.location.search);

      params.forEach((value, key) => {
        url.searchParams.append(key, value);
      });

      // Nach 3 Sekunden weiterleiten
      setTimeout(function () {
        window.location.replace(url.toString());
      }, 1000);
    })();
  </script>



</body>
</html>
